name: Deploy
on:
  workflow_dispatch: { inputs: { client: { description: 'Client slug', required: true } } }
permissions: { contents: read }
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Pre-deploy checks
        run: bash .github/scripts/sitewright-checks.sh
      - name: Deploy
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}' }
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::no token"; exit 0; fi
          npx wrangler pages deploy "dist/${{ github.event.inputs.client }}" --project-name="${{ github.event.inputs.client }}"
