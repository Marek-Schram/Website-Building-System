name: Security Gate
on:
  push: { branches: [main], paths: ['clients/**','packages/**'] }
  pull_request: { branches: [main], paths: ['clients/**','packages/**'] }
  schedule: [{ cron: '0 9 * * 1' }]
  workflow_dispatch: {}
permissions: { contents: read, security-events: write, issues: write }
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: 'fs', scan-ref: '.', severity: 'CRITICAL,HIGH', format: 'sarif', output: 'trivy.sarif' }
        continue-on-error: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: 'trivy.sarif' }
        continue-on-error: true
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        continue-on-error: true
      - name: SiteWright checks
        run: bash .github/scripts/sitewright-checks.sh
